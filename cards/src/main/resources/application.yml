build:
  version: "3.0"

server:
  port: 9000

spring:
  cloud:
    #IMPORTANT
    kubernetes:
      discovery:
        all-namespaces: true
        discovery-server-url: http://spring-cloud-kubernetes-discovery:80
    openfeign:
      circuitbreaker:
        enabled: true
  datasource:
    url: jdbc:mysql://cardsdb:3306/cardsdb
    username: root
    password: root
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  sql:
    init:
      mode: always
  jackson:
    default-property-inclusion: NON_NULL
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest
  application:
    name: cards

management:
  endpoints:
    web:
      exposure:
        include: "*"
      base-path: /actuator
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
    shutdown:
      access: unrestricted
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

cards:
  message: "Welcome to EazyBank cards related Default Docker APIs"
  max-transaction-limit: 50000
  allowed-currencies: "USD,EUR,GBP"
  feature-flags:
    mobile-payments-enabled: true
    international-transfers: false
  contactDetails:
    name: "John Doe - Developer"
    email: "john@eazybank.com"
    onCallSupport:
      - "(555) 555-1234"
      - "(555) 523-1345"

logging:
  level:
    com.eazybank: INFO
    com.netflix.eureka: WARN
    org.springframework.web: WARN
    root: INFO
  pattern:
    level: "%5p [${spring.application.name},%X{trace_id},%X{span_id}]"


info:
  app:
    name: "cards"
    description: "EazyBank Cards Application Default"
    version: "@project.version@"

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2
        failureRateThreshold: 50
        registerHealthIndicator: true
        eventConsumerBufferSize: 10