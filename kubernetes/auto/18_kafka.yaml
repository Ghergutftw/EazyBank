---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  labels:
    app: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      hostname: kafka
      containers:
      - name: kafka
        image: apache/kafka:4.1.0
        ports:
        - containerPort: 9092
        - containerPort: 29092
        - containerPort: 29093
        env:
        - name: KAFKA_BROKER_ID
          valueFrom:
            configMapKeyRef:
              name: eazybank-configmap
              key: KAFKA_BROKER_ID
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          valueFrom:
            configMapKeyRef:
              name: eazybank-configmap
              key: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
        - name: KAFKA_ADVERTISED_LISTENERS
          valueFrom:
            configMapKeyRef:
              name: eazybank-configmap
              key: KAFKA_ADVERTISED_LISTENERS
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          valueFrom:
            configMapKeyRef:
              name: eazybank-configmap
              key: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
        - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
          valueFrom:
            configMapKeyRef:
              name: eazybank-configmap
              key: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
        - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
          valueFrom:
            configMapKeyRef:
              name: eazybank-configmap
              key: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
        - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
          valueFrom:
            configMapKeyRef:
              name: eazybank-configmap
              key: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
        - name: KAFKA_PROCESS_ROLES
          valueFrom:
            configMapKeyRef:
              name: eazybank-configmap
              key: KAFKA_PROCESS_ROLES
        - name: KAFKA_NODE_ID
          valueFrom:
            configMapKeyRef:
              name: eazybank-configmap
              key: KAFKA_NODE_ID
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          valueFrom:
            configMapKeyRef:
              name: eazybank-configmap
              key: KAFKA_CONTROLLER_QUORUM_VOTERS
        - name: KAFKA_LISTENERS
          valueFrom:
            configMapKeyRef:
              name: eazybank-configmap
              key: KAFKA_LISTENERS
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          valueFrom:
            configMapKeyRef:
              name: eazybank-configmap
              key: KAFKA_INTER_BROKER_LISTENER_NAME
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          valueFrom:
            configMapKeyRef:
              name: eazybank-configmap
              key: KAFKA_CONTROLLER_LISTENER_NAMES
        - name: KAFKA_LOG_DIRS
          valueFrom:
            configMapKeyRef:
              name: eazybank-configmap
              key: KAFKA_LOG_DIRS
        - name: CLUSTER_ID
          valueFrom:
            configMapKeyRef:
              name: eazybank-configmap
              key: CLUSTER_ID
        livenessProbe:
          tcpSocket:
            port: 9092
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          tcpSocket:
            port: 9092
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  selector:
    app: kafka
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 9092
      targetPort: 9092
      name: client
    - protocol: TCP
      port: 29092
      targetPort: 29092
      name: internal
    - protocol: TCP
      port: 29093
      targetPort: 29093
      name: controller

