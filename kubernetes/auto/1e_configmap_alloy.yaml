---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
data:
  config.alloy: |
    // Kubernetes service discovery for logs
    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets

      // Keep only pods with specific labels (microservices)
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        regex = "(accounts|loans|cards|configserver|eurekaserver|gatewayserver)"
        action = "keep"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label = "pod"
      }

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label = "namespace"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label = "service"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label = "container"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label = "node"
      }
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pods.output
      forward_to = [loki.write.default.receiver]
    }

    loki.write "default" {
      endpoint {
        url = "http://loki-gateway:3100/loki/api/v1/push"
        tenant_id = "tenant1"
      }
      external_labels = {
        cluster = "eazybank-microservices",
      }
    }

    // Prometheus metrics scraping for microservices
    discovery.kubernetes "prometheus_pods" {
      role = "pod"
    }

    discovery.relabel "prometheus_pods" {
      targets = discovery.kubernetes.prometheus_pods.targets

      // Only scrape pods with actuator endpoints (Spring Boot microservices)
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        regex = "(accounts|loans|cards|configserver|eurekaserver|gatewayserver)"
        action = "keep"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label = "pod"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label = "service"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label = "container"
      }

      rule {
        source_labels = ["__address__"]
        regex = "(.*):(.*)"
        replacement = "${1}:8080"
        target_label = "__address__"
        action = "replace"
      }

      rule {
        target_label = "__metrics_path__"
        replacement = "/actuator/prometheus"
      }
    }

    prometheus.scrape "microservices" {
      targets = discovery.relabel.prometheus_pods.output
      forward_to = [prometheus.remote_write.default.receiver]
      scrape_interval = "15s"
      metrics_path = "/actuator/prometheus"
    }

    prometheus.remote_write "default" {
      endpoint {
        url = "http://prometheus:9090/api/v1/write"
      }
    }

