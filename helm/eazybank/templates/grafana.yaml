{{- if .Values.grafana.enabled }}
{{/*
Grafana - Observability Dashboard
Provides visualization for metrics, logs, and traces
Auto-provisions datasources for Prometheus, Loki, and Tempo
*/}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "eazybank.fullname" . }}-grafana-datasource
  labels:
    {{- include "eazybank.microservice.labels" (dict "name" "grafana" "context" .) | nindent 4 }}
data:
  datasource.yml: |
    apiVersion: 1

    deleteDatasources:
      - name: Prometheus
      - name: Loki
      - name: Tempo

    datasources:
      {{- if .Values.prometheus.enabled }}
      # Prometheus for metrics visualization
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus:{{ .Values.prometheus.service.port | default 9090 }}
        access: proxy
        orgId: 1
        basicAuth: false
        isDefault: false
        version: 1
        editable: true
        jsonData:
          httpMethod: GET
      {{- end }}
      {{- if .Values.tempo.enabled }}
      # Tempo for distributed tracing
      - name: Tempo
        type: tempo
        uid: tempo
        url: http://tempo:3200
        access: proxy
        orgId: 1
        basicAuth: false
        isDefault: false
        version: 1
        editable: true
        jsonData:
          httpMethod: GET
          {{- if .Values.prometheus.enabled }}
          # Link traces to service map in Prometheus
          serviceMap:
            datasourceUid: 'prometheus'
          {{- end }}
      {{- end }}
      {{- if .Values.loki.enabled }}
      # Loki for log aggregation
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        orgId: 1
        editable: true
        url: http://loki-gateway:3100
        jsonData:
          httpHeaderName1: "X-Scope-OrgID"
          derivedFields:
            # Extract trace IDs from logs to link to Tempo
            - datasourceUid: tempo
              matcherRegex: "traceId=(\\w+)"
              name: TraceID
              url: "$${__value.raw}"
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    {{- include "eazybank.microservice.labels" (dict "name" "grafana" "context" .) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "eazybank.microservice.selectorLabels" (dict "name" "grafana" "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "eazybank.microservice.selectorLabels" (dict "name" "grafana" "context" .) | nindent 8 }}
    spec:
      containers:
      - name: grafana
        image: {{ .Values.grafana.image.repository }}:{{ .Values.grafana.image.tag | default "latest" }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: 3000
        env:
        - name: GF_SECURITY_ADMIN_USER
          valueFrom:
            configMapKeyRef:
              name: {{ include "eazybank.fullname" . }}-config
              key: GF_SECURITY_ADMIN_USER
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: {{ include "eazybank.fullname" . }}-config
              key: GF_SECURITY_ADMIN_PASSWORD
        - name: GF_USERS_ALLOW_SIGN_UP
          valueFrom:
            configMapKeyRef:
              name: {{ include "eazybank.fullname" . }}-config
              key: GF_USERS_ALLOW_SIGN_UP
        volumeMounts:
        - name: grafana-data
          mountPath: /var/lib/grafana
        - name: grafana-datasource
          mountPath: /etc/grafana/provisioning/datasources
      volumes:
      # Using emptyDir - use PersistentVolume for production
      - name: grafana-data
        emptyDir: {}
      - name: grafana-datasource
        configMap:
          name: {{ include "eazybank.fullname" . }}-grafana-datasource
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    {{- include "eazybank.microservice.labels" (dict "name" "grafana" "context" .) | nindent 4 }}
spec:
  selector:
    {{- include "eazybank.microservice.selectorLabels" (dict "name" "grafana" "context" .) | nindent 4 }}
  type: {{ .Values.grafana.service.type | default "LoadBalancer" }}
  ports:
    - name: http
      port: {{ .Values.grafana.service.port | default 3000 }}
      targetPort: 3000
{{- end }}

