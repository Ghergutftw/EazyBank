{{- if .Values.message.enabled }}
{{/*
Message Microservice
Handles asynchronous message processing via RabbitMQ
Demonstrates event-driven architecture patterns
*/}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: message
  labels:
    {{- include "eazybank.microservice.labels" (dict "name" "message" "context" .) | nindent 4 }}
spec:
  replicas: {{ .Values.message.replicaCount }}
  selector:
    matchLabels:
      {{- include "eazybank.microservice.selectorLabels" (dict "name" "message" "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "eazybank.microservice.selectorLabels" (dict "name" "message" "context" .) | nindent 8 }}
    spec:
      containers:
      - name: message
        image: {{ include "eazybank.image" (dict "repository" .Values.message.image.repository "tag" .Values.message.image.tag "context" .) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: {{ .Values.message.containerPort }}
        env:
        - name: SPRING_RABBITMQ_HOST
          valueFrom:
            configMapKeyRef:
              name: {{ include "eazybank.fullname" . }}-config
              key: SPRING_RABBITMQ_HOST
        {{- include "eazybank.resources" .Values.message.resources | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: message
  labels:
    {{- include "eazybank.microservice.labels" (dict "name" "message" "context" .) | nindent 4 }}
spec:
  selector:
    {{- include "eazybank.microservice.selectorLabels" (dict "name" "message" "context" .) | nindent 4 }}
  type: {{ .Values.message.service.type }}
  ports:
    - protocol: TCP
      port: {{ .Values.message.service.port }}
      targetPort: {{ .Values.message.containerPort }}
{{- end }}

