{{- if .Values.message.enabled }}
# Message Service - handles async message processing via RabbitMQ
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: message
  labels:
    app: message
spec:
  replicas: {{ .Values.message.replicaCount }}
  selector:
    matchLabels:
      app: message
  template:
    metadata:
      labels:
        app: message
    spec:
      containers:
      - name: message
        image: {{ .Values.message.image.repository }}:{{ .Values.message.image.tag }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: {{ .Values.message.containerPort }}
        env:
        - name: SPRING_RABBITMQ_HOST
          valueFrom:
            configMapKeyRef:
              name: eazybank-config
              key: SPRING_RABBITMQ_HOST
        resources:
          limits:
            memory: {{ .Values.message.resources.limits.memory }}
          requests:
            memory: {{ .Values.message.resources.requests.memory }}
            cpu: {{ .Values.message.resources.requests.cpu }}
---
apiVersion: v1
kind: Service
metadata:
  name: message
  labels:
    app: message
spec:
  selector:
    app: message
  type: {{ .Values.message.service.type }}
  ports:
    - protocol: TCP
      port: {{ .Values.message.service.port }}
      targetPort: {{ .Values.message.containerPort }}
{{- end }}

