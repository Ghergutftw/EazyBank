{{- if .Values.configserver.enabled }}
# Config Server - centralized configuration management
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.configserver.service.name }}
  labels:
    app: {{ .Values.configserver.labels.app }}
    tier: {{ .Values.configserver.labels.tier }}
spec:
  replicas: {{ .Values.configserver.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.configserver.labels.app }}
  template:
    metadata:
      labels:
        app: {{ .Values.configserver.labels.app }}
        {{- if .Values.configserver.labels.tier }}
        tier: {{ .Values.configserver.labels.tier }}
        {{- end }}
    spec:
      containers:
      - name: configserver
        image: {{ .Values.configserver.image.repository }}:{{ .Values.configserver.image.tag }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: {{ .Values.configserver.containerPort }}
        resources:
          limits:
            memory: {{ .Values.configserver.resources.limits.memory }}
          requests:
            memory: {{ .Values.configserver.resources.requests.memory }}
            cpu: {{ .Values.configserver.resources.requests.cpu }}
        livenessProbe:
          httpGet:
            path: {{ .Values.configserver.probes.liveness.path }}
            port: {{ .Values.configserver.containerPort }}
          initialDelaySeconds: {{ .Values.configserver.probes.liveness.initialDelaySeconds }}
          periodSeconds: {{ .Values.configserver.probes.liveness.periodSeconds }}
          timeoutSeconds: {{ .Values.configserver.probes.liveness.timeoutSeconds }}
        readinessProbe:
          httpGet:
            path: {{ .Values.configserver.probes.readiness.path }}
            port: {{ .Values.configserver.containerPort }}
          initialDelaySeconds: {{ .Values.configserver.probes.readiness.initialDelaySeconds }}
          periodSeconds: {{ .Values.configserver.probes.readiness.periodSeconds }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.configserver.service.name }}
  labels:
    app: {{ .Values.configserver.labels.app }}
spec:
  selector:
    app: {{ .Values.configserver.labels.app }}
  type: {{ .Values.configserver.service.type }}
  ports:
    - protocol: TCP
      name: http
      port: {{ .Values.configserver.service.port }}
      targetPort: {{ .Values.configserver.containerPort }}
{{- end }}

