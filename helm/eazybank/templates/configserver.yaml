{{- if .Values.configserver.enabled }}
{{/*
Spring Cloud Config Server
Provides centralized external configuration management for all microservices
Implements 12-factor app methodology for configuration
*/}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: configserver
  labels:
    {{- include "eazybank.microservice.labels" (dict "name" "configserver" "context" .) | nindent 4 }}
spec:
  replicas: {{ .Values.configserver.replicaCount }}
  selector:
    matchLabels:
      {{- include "eazybank.microservice.selectorLabels" (dict "name" "configserver" "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "eazybank.microservice.selectorLabels" (dict "name" "configserver" "context" .) | nindent 8 }}
    spec:
      containers:
      - name: configserver
        image: {{ include "eazybank.image" (dict "repository" .Values.configserver.image.repository "tag" .Values.configserver.image.tag "context" .) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: {{ .Values.configserver.containerPort }}
        {{- include "eazybank.resources" .Values.configserver.resources | nindent 8 }}
        {{- include "eazybank.springboot.livenessProbe" (dict "path" .Values.configserver.probes.liveness.path "port" .Values.configserver.containerPort "initialDelay" .Values.configserver.probes.liveness.initialDelaySeconds "period" .Values.configserver.probes.liveness.periodSeconds "timeout" .Values.configserver.probes.liveness.timeoutSeconds "failureThreshold" 3) | nindent 8 }}
        {{- include "eazybank.springboot.readinessProbe" (dict "path" .Values.configserver.probes.readiness.path "port" .Values.configserver.containerPort "initialDelay" .Values.configserver.probes.readiness.initialDelaySeconds "period" .Values.configserver.probes.readiness.periodSeconds "timeout" .Values.configserver.probes.readiness.timeoutSeconds "failureThreshold" 3) | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: configserver
  labels:
    {{- include "eazybank.microservice.labels" (dict "name" "configserver" "context" .) | nindent 4 }}
spec:
  selector:
    {{- include "eazybank.microservice.selectorLabels" (dict "name" "configserver" "context" .) | nindent 4 }}
  type: {{ .Values.configserver.service.type }}
  ports:
    - protocol: TCP
      port: {{ .Values.configserver.service.port }}
      targetPort: {{ .Values.configserver.containerPort }}
{{- end }}

