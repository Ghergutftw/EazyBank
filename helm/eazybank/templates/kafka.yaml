{{- if .Values.kafka.enabled }}
{{/*
Apache Kafka - Event Streaming Platform
Runs in KRaft mode (without Zookeeper)
Alternative to RabbitMQ for event-driven architecture
*/}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  labels:
    {{- include "eazybank.microservice.labels" (dict "name" "kafka" "context" .) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "eazybank.microservice.selectorLabels" (dict "name" "kafka" "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "eazybank.microservice.selectorLabels" (dict "name" "kafka" "context" .) | nindent 8 }}
    spec:
      # Kafka requires stable hostname for clustering
      hostname: kafka
      containers:
      - name: kafka
        image: {{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag | default "latest" }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: 9092
          name: client
        - containerPort: 29092
          name: internal
        - containerPort: 29093
          name: controller
        env:
        - name: KAFKA_BROKER_ID
          valueFrom:
            configMapKeyRef:
              name: {{ include "eazybank.fullname" . }}-config
              key: KAFKA_BROKER_ID
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          valueFrom:
            configMapKeyRef:
              name: {{ include "eazybank.fullname" . }}-config
              key: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
        - name: KAFKA_ADVERTISED_LISTENERS
          valueFrom:
            configMapKeyRef:
              name: {{ include "eazybank.fullname" . }}-config
              key: KAFKA_ADVERTISED_LISTENERS
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          valueFrom:
            configMapKeyRef:
              name: {{ include "eazybank.fullname" . }}-config
              key: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
        - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
          valueFrom:
            configMapKeyRef:
              name: {{ include "eazybank.fullname" . }}-config
              key: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
        - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
          valueFrom:
            configMapKeyRef:
              name: {{ include "eazybank.fullname" . }}-config
              key: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
        - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
          valueFrom:
            configMapKeyRef:
              name: {{ include "eazybank.fullname" . }}-config
              key: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
        - name: KAFKA_PROCESS_ROLES
          valueFrom:
            configMapKeyRef:
              name: {{ include "eazybank.fullname" . }}-config
              key: KAFKA_PROCESS_ROLES
        - name: KAFKA_NODE_ID
          valueFrom:
            configMapKeyRef:
              name: {{ include "eazybank.fullname" . }}-config
              key: KAFKA_NODE_ID
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          valueFrom:
            configMapKeyRef:
              name: {{ include "eazybank.fullname" . }}-config
              key: KAFKA_CONTROLLER_QUORUM_VOTERS
        - name: KAFKA_LISTENERS
          valueFrom:
            configMapKeyRef:
              name: {{ include "eazybank.fullname" . }}-config
              key: KAFKA_LISTENERS
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          valueFrom:
            configMapKeyRef:
              name: {{ include "eazybank.fullname" . }}-config
              key: KAFKA_INTER_BROKER_LISTENER_NAME
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          valueFrom:
            configMapKeyRef:
              name: {{ include "eazybank.fullname" . }}-config
              key: KAFKA_CONTROLLER_LISTENER_NAMES
        - name: KAFKA_LOG_DIRS
          valueFrom:
            configMapKeyRef:
              name: {{ include "eazybank.fullname" . }}-config
              key: KAFKA_LOG_DIRS
        - name: CLUSTER_ID
          valueFrom:
            configMapKeyRef:
              name: {{ include "eazybank.fullname" . }}-config
              key: CLUSTER_ID
        {{- if .Values.kafka.extraEnv }}
        # Additional Kafka configuration from values
        {{- range $key, $value := .Values.kafka.extraEnv }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        {{- end }}
        livenessProbe:
          tcpSocket:
            port: 9092
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          tcpSocket:
            port: 9092
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    {{- include "eazybank.microservice.labels" (dict "name" "kafka" "context" .) | nindent 4 }}
spec:
  selector:
    {{- include "eazybank.microservice.selectorLabels" (dict "name" "kafka" "context" .) | nindent 4 }}
  type: {{ .Values.kafka.service.type | default "ClusterIP" }}
  ports:
    - protocol: TCP
      port: {{ .Values.kafka.service.port | default 9092 }}
      targetPort: 9092
      name: client
    - protocol: TCP
      port: 29092
      targetPort: 29092
      name: internal
    - protocol: TCP
      port: 29093
      targetPort: 29093
      name: controller
{{- end }}

