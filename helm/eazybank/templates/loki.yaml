{{- if .Values.loki.enabled }}
{{/*
Loki - Log Aggregation System
Runs in microservices mode with read, write, and backend components
*/}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  labels:
    app: loki
data:
  config.yaml: |
    server:
      http_listen_address: 0.0.0.0
      http_listen_port: 3100

    memberlist:
      join_members: ["loki-read", "loki-write", "loki-backend"]
      dead_node_reclaim_time: 30s
      gossip_to_dead_nodes_time: 15s
      left_ingesters_timeout: 30s
      bind_addr: ['0.0.0.0']
      bind_port: 7946
      gossip_interval: 2s

    schema_config:
      configs:
        - from: 2023-01-01
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: index_
            period: 24h

    common:
      path_prefix: /loki
      replication_factor: 1
      compactor_address: http://loki-backend:3100
      storage:
        s3:
          endpoint: minio:9000
          insecure: true
          bucketnames: loki-data
          access_key_id: loki
          secret_access_key: supersecret
          s3forcepathstyle: true
      ring:
        kvstore:
          store: memberlist

    ruler:
      storage:
        s3:
          bucketnames: loki-ruler

    compactor:
      working_directory: /tmp/compactor
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki-read
  labels:
    app: loki-read
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki-read
  template:
    metadata:
      labels:
        app: loki-read
    spec:
      containers:
      - name: loki-read
        image: {{ .Values.loki.image.repository }}:{{ .Values.loki.image.tag | default "latest" }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        args:
        - -config.file=/etc/loki/config.yaml
        - -target=read
        ports:
        - containerPort: 3100
          name: http
        - containerPort: 7946
          name: gossip
        - containerPort: 9095
          name: grpc
        volumeMounts:
        - name: loki-config
          mountPath: /etc/loki
      volumes:
      - name: loki-config
        configMap:
          name: loki-config
---
apiVersion: v1
kind: Service
metadata:
  name: loki-read
  labels:
    app: loki-read
spec:
  selector:
    app: loki-read
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 3100
      targetPort: 3100
      name: http
    - protocol: TCP
      port: 7946
      targetPort: 7946
      name: gossip
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki-write
  labels:
    app: loki-write
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki-write
  template:
    metadata:
      labels:
        app: loki-write
    spec:
      containers:
      - name: loki-write
        image: {{ .Values.loki.image.repository }}:{{ .Values.loki.image.tag | default "latest" }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        args:
        - -config.file=/etc/loki/config.yaml
        - -target=write
        ports:
        - containerPort: 3100
          name: http
        - containerPort: 7946
          name: gossip
        - containerPort: 9095
          name: grpc
        volumeMounts:
        - name: loki-config
          mountPath: /etc/loki
      volumes:
      - name: loki-config
        configMap:
          name: loki-config
---
apiVersion: v1
kind: Service
metadata:
  name: loki-write
  labels:
    app: loki-write
spec:
  selector:
    app: loki-write
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 3100
      targetPort: 3100
      name: http
    - protocol: TCP
      port: 7946
      targetPort: 7946
      name: gossip
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki-backend
  labels:
    app: loki-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki-backend
  template:
    metadata:
      labels:
        app: loki-backend
    spec:
      containers:
      - name: loki-backend
        image: {{ .Values.loki.image.repository }}:{{ .Values.loki.image.tag | default "latest" }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        args:
        - -config.file=/etc/loki/config.yaml
        - -target=backend
        - -legacy-read-mode=false
        ports:
        - containerPort: 3100
          name: http
        - containerPort: 7946
          name: gossip
        volumeMounts:
        - name: loki-config
          mountPath: /etc/loki
      volumes:
      - name: loki-config
        configMap:
          name: loki-config
---
apiVersion: v1
kind: Service
metadata:
  name: loki-backend
  labels:
    app: loki-backend
spec:
  selector:
    app: loki-backend
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 3100
      targetPort: 3100
      name: http
    - protocol: TCP
      port: 7946
      targetPort: 7946
      name: gossip
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-gateway-config
  labels:
    app: loki-gateway
data:
  nginx.conf: |
    worker_processes  5;
    error_log  /dev/stderr;
    pid        /tmp/nginx.pid;
    worker_rlimit_nofile 8192;

    events {
      worker_connections  4096;
    }

    http {
      default_type application/octet-stream;
      log_format   main '$remote_addr - $remote_user [$time_local]  $status '
        '"$request" $body_bytes_sent "$http_referer" '
        '"$http_user_agent" "$http_x_forwarded_for"';
      access_log   /dev/stderr  main;

      sendfile     on;
      tcp_nopush   on;

      upstream read {
        server loki-read:3100;
      }

      upstream write {
        server loki-write:3100;
      }

      upstream backend {
        server loki-backend:3100;
      }

      server {
        listen 3100;

        location = / {
          return 200 'OK';
          auth_basic off;
        }

        location = /api/prom/push {
          proxy_pass       http://write$request_uri;
        }

        location = /api/prom/tail {
          proxy_pass       http://read$request_uri;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
        }

        location ~ /api/prom/.* {
          proxy_pass       http://read$request_uri;
        }

        location = /loki/api/v1/push {
          proxy_pass       http://write$request_uri;
        }

        location = /loki/api/v1/tail {
          proxy_pass       http://read$request_uri;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
        }

        location ~ /loki/api/.* {
          proxy_pass       http://read$request_uri;
        }

        location ~ /compactor/.* {
          proxy_pass       http://backend$request_uri;
        }

        location ~ /distributor/.* {
          proxy_pass       http://write$request_uri;
        }

        location ~ /ring {
          proxy_pass       http://backend$request_uri;
        }

        location ~ /ingester/.* {
          proxy_pass       http://backend$request_uri;
        }

        location ~ /ruler/.* {
          proxy_pass       http://backend$request_uri;
        }

        location ~ /scheduler/.* {
          proxy_pass       http://backend$request_uri;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki-gateway
  labels:
    app: loki-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki-gateway
  template:
    metadata:
      labels:
        app: loki-gateway
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: 3100
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: nginx-config
        configMap:
          name: loki-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: loki-gateway
  labels:
    app: loki-gateway
spec:
  selector:
    app: loki-gateway
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 3100
      targetPort: 3100
{{- end }}

