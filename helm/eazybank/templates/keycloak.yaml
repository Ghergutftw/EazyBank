{{- if .Values.keycloak.enabled }}
{{/*
Keycloak - Identity and Access Management
Provides OAuth2/OIDC authentication and authorization
Runs in development mode - configure properly for production
*/}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
      - name: keycloak
        image: {{ .Values.keycloak.image.repository }}:{{ .Values.keycloak.image.tag | default "latest" }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        # WARNING: start-dev is for development only!
        # Use proper configuration with database for production
        args: ["start-dev"]
        env:
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          valueFrom:
            configMapKeyRef:
              name: eazybank-config
              key: KC_BOOTSTRAP_ADMIN_USERNAME
        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: eazybank-config
              key: KC_BOOTSTRAP_ADMIN_PASSWORD
        ports:
        - name: http
          containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    app: keycloak
spec:
  selector:
    app: keycloak
  type: {{ .Values.keycloak.service.type | default "LoadBalancer" }}
  ports:
    - name: http
      port: {{ .Values.keycloak.service.port | default 7080 }}
      targetPort: 8080
{{- end }}

