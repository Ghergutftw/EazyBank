{{- if .Values.loans.enabled }}
# Loans Microservice - manages customer loan operations
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.loans.name }}
  labels:
    app: {{ .Values.loans.labels.app }}
    {{- if .Values.loans.labels.tier }}
    tier: {{ .Values.loans.labels.tier }}
    {{- end }}
spec:
  replicas: {{ .Values.loans.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.loans.labels.app }}
  template:
    metadata:
      labels:
        app: {{ .Values.loans.labels.app }}
        {{- if .Values.loans.labels.tier }}
        tier: {{ .Values.loans.labels.tier }}
        {{- end }}
    spec:
      initContainers:
      - name: wait-for-rabbitmq
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z rabbitmq 5672; do echo waiting for rabbitmq; sleep 2; done;']
      - name: wait-for-configserver
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z configserver 8071; do echo waiting for configserver; sleep 2; done;']
      containers:
      - name: loans
        image: {{ .Values.loans.image.repository }}:{{ .Values.loans.image.tag }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: {{ .Values.loans.containerPort }}
        env:
        - name: SPRING_PROFILES_ACTIVE
          valueFrom:
            configMapKeyRef:
              name: eazybank-config
              key: SPRING_PROFILES_ACTIVE
        - name: SPRING_CONFIG_IMPORT
          valueFrom:
            configMapKeyRef:
              name: eazybank-config
              key: SPRING_CONFIG_IMPORT
        - name: SPRING_RABBITMQ_HOST
          valueFrom:
            configMapKeyRef:
              name: eazybank-config
              key: SPRING_RABBITMQ_HOST
        - name: SPRING_CLOUD_STREAM_DEFAULT-BINDER
          valueFrom:
            configMapKeyRef:
              name: eazybank-config
              key: SPRING_CLOUD_STREAM_DEFAULT-BINDER
        {{- if .Values.config.observability.enabled }}
        - name: JAVA_TOOL_OPTIONS
          valueFrom:
            configMapKeyRef:
              name: eazybank-config
              key: JAVA_TOOL_OPTIONS
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: eazybank-config
              key: OTEL_EXPORTER_OTLP_ENDPOINT
        - name: OTEL_METRICS_EXPORTER
          valueFrom:
            configMapKeyRef:
              name: eazybank-config
              key: OTEL_METRICS_EXPORTER
        - name: OTEL_LOGS_EXPORTER
          valueFrom:
            configMapKeyRef:
              name: eazybank-config
              key: OTEL_LOGS_EXPORTER
        - name: OTEL_SERVICE_NAME
          value: "loans"
        {{- end }}
        resources:
          limits:
            memory: {{ .Values.loans.resources.limits.memory }}
          requests:
            memory: {{ .Values.loans.resources.requests.memory }}
            cpu: {{ .Values.loans.resources.requests.cpu }}
        livenessProbe:
          httpGet:
            path: {{ .Values.loans.probes.liveness.path }}
            port: {{ .Values.loans.containerPort }}
          initialDelaySeconds: {{ .Values.loans.probes.liveness.initialDelaySeconds }}
          periodSeconds: {{ .Values.loans.probes.liveness.periodSeconds }}
          timeoutSeconds: {{ .Values.loans.probes.liveness.timeoutSeconds }}
          failureThreshold: {{ .Values.loans.probes.liveness.failureThreshold }}
        readinessProbe:
          httpGet:
            path: {{ .Values.loans.probes.readiness.path }}
            port: {{ .Values.loans.containerPort }}
          initialDelaySeconds: {{ .Values.loans.probes.readiness.initialDelaySeconds }}
          periodSeconds: {{ .Values.loans.probes.readiness.periodSeconds }}
          timeoutSeconds: {{ .Values.loans.probes.readiness.timeoutSeconds }}
          failureThreshold: {{ .Values.loans.probes.readiness.failureThreshold }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.loans.service.name }}
  labels:
    app: {{ .Values.loans.labels.app }}
spec:
  selector:
    app: {{ .Values.loans.labels.app }}
  type: {{ .Values.loans.service.type }}
  ports:
    - protocol: TCP
      name: http
      port: {{ .Values.loans.service.port }}
      targetPort: {{ .Values.loans.containerPort }}
{{- end }}

