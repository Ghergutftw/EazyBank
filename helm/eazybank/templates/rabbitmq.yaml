{{- if .Values.rabbitmq.enabled }}
# RabbitMQ - message broker for async communication
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  labels:
    app: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      hostname: rabbitmq
      containers:
      - name: rabbitmq
        image: {{ .Values.rabbitmq.image.repository }}:{{ .Values.rabbitmq.image.tag }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: {{ .Values.rabbitmq.service.amqpPort }}
          name: amqp
        - containerPort: {{ .Values.rabbitmq.service.managementPort }}
          name: management
        livenessProbe:
          exec:
            command:
            - rabbitmq-diagnostics
            - check_port_connectivity
          initialDelaySeconds: {{ .Values.rabbitmq.probes.liveness.initialDelaySeconds }}
          periodSeconds: {{ .Values.rabbitmq.probes.liveness.periodSeconds }}
          timeoutSeconds: {{ .Values.rabbitmq.probes.liveness.timeoutSeconds }}
        readinessProbe:
          exec:
            command:
            - rabbitmq-diagnostics
            - check_port_connectivity
          initialDelaySeconds: {{ .Values.rabbitmq.probes.readiness.initialDelaySeconds }}
          periodSeconds: {{ .Values.rabbitmq.probes.readiness.periodSeconds }}
          timeoutSeconds: {{ .Values.rabbitmq.probes.readiness.timeoutSeconds }}
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    app: rabbitmq
spec:
  selector:
    app: rabbitmq
  type: {{ .Values.rabbitmq.service.type }}
  ports:
    - protocol: TCP
      port: {{ .Values.rabbitmq.service.amqpPort }}
      targetPort: {{ .Values.rabbitmq.service.amqpPort }}
      name: amqp
    - protocol: TCP
      port: {{ .Values.rabbitmq.service.managementPort }}
      targetPort: {{ .Values.rabbitmq.service.managementPort }}
      name: management
{{- end }}

