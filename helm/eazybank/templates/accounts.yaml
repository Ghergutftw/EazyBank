{{- if .Values.accounts.enabled }}
# Accounts Microservice - manages customer account operations
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.accounts.service.name }}
  labels:
    app: {{ .Values.accounts.labels.app }}
spec:
  replicas: {{ .Values.accounts.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.accounts.labels.app }}
  template:
    metadata:
      labels:
        app: {{ .Values.accounts.labels.app }}
    spec:
     containers:
      - name: accounts
        image: {{ .Values.accounts.image.repository }}:{{ .Values.accounts.image.tag }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: {{ .Values.accounts.containerPort }}
        env:
        - name: SPRING_PROFILES_ACTIVE
          valueFrom:
            configMapKeyRef:
              name: eazybank-config
              key: SPRING_PROFILES_ACTIVE
        - name: SPRING_CONFIG_IMPORT
          valueFrom:
            configMapKeyRef:
              name: eazybank-config
              key: SPRING_CONFIG_IMPORT
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          valueFrom:
            configMapKeyRef:
              name: eazybank-config
              key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        - name: SPRING_RABBITMQ_HOST
          valueFrom:
            configMapKeyRef:
              name: eazybank-config
              key: SPRING_RABBITMQ_HOST
        - name: SPRING_CLOUD_STREAM_DEFAULT-BINDER
          valueFrom:
            configMapKeyRef:
              name: eazybank-config
              key: SPRING_CLOUD_STREAM_DEFAULT-BINDER
        {{- if .Values.config.observability.enabled }}
        - name: JAVA_TOOL_OPTIONS
          valueFrom:
            configMapKeyRef:
              name: eazybank-config
              key: JAVA_TOOL_OPTIONS
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: eazybank-config
              key: OTEL_EXPORTER_OTLP_ENDPOINT
        - name: OTEL_METRICS_EXPORTER
          valueFrom:
            configMapKeyRef:
              name: eazybank-config
              key: OTEL_METRICS_EXPORTER
        - name: OTEL_LOGS_EXPORTER
          valueFrom:
            configMapKeyRef:
              name: eazybank-config
              key: OTEL_LOGS_EXPORTER
        - name: OTEL_SERVICE_NAME
          value: "accounts"
        {{- end }}
        resources:
          limits:
            memory: {{ .Values.accounts.resources.limits.memory }}
          requests:
            memory: {{ .Values.accounts.resources.requests.memory }}
            cpu: {{ .Values.accounts.resources.requests.cpu }}
        livenessProbe:
          httpGet:
            path: {{ .Values.accounts.probes.liveness.path }}
            port: {{ .Values.accounts.containerPort }}
          initialDelaySeconds: {{ .Values.accounts.probes.liveness.initialDelaySeconds }}
          periodSeconds: {{ .Values.accounts.probes.liveness.periodSeconds }}
          timeoutSeconds: {{ .Values.accounts.probes.liveness.timeoutSeconds }}
          failureThreshold: {{ .Values.accounts.probes.liveness.failureThreshold }}
        readinessProbe:
          httpGet:
            path: {{ .Values.accounts.probes.readiness.path }}
            port: {{ .Values.accounts.containerPort }}
          initialDelaySeconds: {{ .Values.accounts.probes.readiness.initialDelaySeconds }}
          periodSeconds: {{ .Values.accounts.probes.readiness.periodSeconds }}
          timeoutSeconds: {{ .Values.accounts.probes.readiness.timeoutSeconds }}
          failureThreshold: {{ .Values.accounts.probes.readiness.failureThreshold }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.accounts.service.name }}
  labels:
    app: {{ .Values.accounts.labels.app }}
spec:
  selector:
    app: {{ .Values.accounts.labels.app }}
  type: {{ .Values.accounts.service.type }}
  ports:
    - protocol: TCP
      name: http
      port: {{ .Values.accounts.service.port }}
      targetPort: {{ .Values.accounts.containerPort }}
{{- end }}

