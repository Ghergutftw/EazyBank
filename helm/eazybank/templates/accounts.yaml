{{- if .Values.accounts.enabled }}
{{/*
Accounts Microservice
Manages customer account operations
Demonstrates standard Spring Boot microservice pattern
*/}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounts
  labels:
    {{- include "eazybank.microservice.labels" (dict "name" "accounts" "context" .) | nindent 4 }}
spec:
  replicas: {{ .Values.accounts.replicaCount }}
  selector:
    matchLabels:
      {{- include "eazybank.microservice.selectorLabels" (dict "name" "accounts" "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "eazybank.microservice.selectorLabels" (dict "name" "accounts" "context" .) | nindent 8 }}
    spec:
      containers:
      - name: accounts
        image: {{ include "eazybank.image" (dict "repository" .Values.accounts.image.repository "tag" .Values.accounts.image.tag "context" .) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: {{ .Values.accounts.containerPort }}
        env:
        {{- include "eazybank.springboot.env" . | nindent 8 }}
        {{- include "eazybank.resources" .Values.accounts.resources | nindent 8 }}
        {{- include "eazybank.springboot.livenessProbe" (dict "path" .Values.accounts.probes.liveness.path "port" .Values.accounts.containerPort "initialDelay" .Values.accounts.probes.liveness.initialDelaySeconds "period" .Values.accounts.probes.liveness.periodSeconds "timeout" .Values.accounts.probes.liveness.timeoutSeconds "failureThreshold" .Values.accounts.probes.liveness.failureThreshold) | nindent 8 }}
        {{- include "eazybank.springboot.readinessProbe" (dict "path" .Values.accounts.probes.readiness.path "port" .Values.accounts.containerPort "initialDelay" .Values.accounts.probes.readiness.initialDelaySeconds "period" .Values.accounts.probes.readiness.periodSeconds "timeout" .Values.accounts.probes.readiness.timeoutSeconds "failureThreshold" .Values.accounts.probes.readiness.failureThreshold) | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: accounts
  labels:
    {{- include "eazybank.microservice.labels" (dict "name" "accounts" "context" .) | nindent 4 }}
spec:
  selector:
    {{- include "eazybank.microservice.selectorLabels" (dict "name" "accounts" "context" .) | nindent 4 }}
  type: {{ .Values.accounts.service.type }}
  ports:
    - protocol: TCP
      port: {{ .Values.accounts.service.port }}
      targetPort: {{ .Values.accounts.containerPort }}
{{- end }}

