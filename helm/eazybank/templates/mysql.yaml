{{/*
MySQL Database Instances
Each microservice has its own database following microservices best practices
*/}}

{{- if .Values.mysql.accountsdb.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: accountsdb
  labels:
    {{- include "eazybank.microservice.labels" (dict "name" "accountsdb" "context" .) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "eazybank.microservice.selectorLabels" (dict "name" "accountsdb" "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "eazybank.microservice.selectorLabels" (dict "name" "accountsdb" "context" .) | nindent 8 }}
    spec:
      containers:
      - name: accountsdb
        image: {{ include "eazybank.image" (dict "repository" .Values.mysql.accountsdb.image.repository "tag" .Values.mysql.accountsdb.image.tag "context" .) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: {{ .Values.mysql.accountsdb.service.port }}
        env:
        {{- include "eazybank.mysql.env" (dict "database" .Values.mysql.accountsdb.database "context" .) | nindent 8 }}
        {{- include "eazybank.mysql.livenessProbe" .Values.mysql.accountsdb.probes | nindent 8 }}
        {{- include "eazybank.mysql.readinessProbe" .Values.mysql.accountsdb.probes | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: accountsdb
  labels:
    {{- include "eazybank.microservice.labels" (dict "name" "accountsdb" "context" .) | nindent 4 }}
spec:
  selector:
    {{- include "eazybank.microservice.selectorLabels" (dict "name" "accountsdb" "context" .) | nindent 4 }}
  type: {{ .Values.mysql.accountsdb.service.type }}
  ports:
    - protocol: TCP
      port: {{ .Values.mysql.accountsdb.service.port }}
      targetPort: {{ .Values.mysql.accountsdb.service.port }}
{{- end }}

