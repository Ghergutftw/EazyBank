# MySQL Databases - each microservice has its own database

{{- if .Values.mysql.accountsdb.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: accountsdb
  labels:
    app: accountsdb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: accountsdb
  template:
    metadata:
      labels:
        app: accountsdb
    spec:
      containers:
      - name: accountsdb
        image: {{ .Values.mysql.accountsdb.image.repository }}:{{ .Values.mysql.accountsdb.image.tag }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: {{ .Values.mysql.accountsdb.service.port }}
        env:
        - name: MYSQL_DATABASE
          value: {{ .Values.mysql.accountsdb.database | quote }}
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: eazybank-configmap
              key: MYSQL_ROOT_PASSWORD
        livenessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
          initialDelaySeconds: {{ .Values.mysql.accountsdb.probes.initialDelaySeconds }}
          periodSeconds: {{ .Values.mysql.accountsdb.probes.periodSeconds }}
          timeoutSeconds: {{ .Values.mysql.accountsdb.probes.timeoutSeconds }}
        readinessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
          initialDelaySeconds: {{ .Values.mysql.accountsdb.probes.initialDelaySeconds }}
          periodSeconds: {{ .Values.mysql.accountsdb.probes.periodSeconds }}
          timeoutSeconds: {{ .Values.mysql.accountsdb.probes.timeoutSeconds }}
---
apiVersion: v1
kind: Service
metadata:
  name: accountsdb
  labels:
    app: accountsdb
spec:
  selector:
    app: accountsdb
  type: {{ .Values.mysql.accountsdb.service.type }}
  ports:
    - protocol: TCP
      port: {{ .Values.mysql.accountsdb.service.port }}
      targetPort: {{ .Values.mysql.accountsdb.service.port }}
{{- end }}

