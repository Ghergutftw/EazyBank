{{- if .Values.gatewayserver.enabled }}
# Gateway Server - API Gateway (main entry point for all requests)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.gatewayserver.service.name }}
  labels:
    app: {{ .Values.gatewayserver.labels.app }}
    {{- if .Values.gatewayserver.labels.tier }}
    tier: {{ .Values.gatewayserver.labels.tier }}
    {{- end }}
spec:
  replicas: {{ .Values.gatewayserver.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.gatewayserver.labels.app }}
  template:
    metadata:
      labels:
        app: {{ .Values.gatewayserver.labels.app }}
        {{- if .Values.gatewayserver.labels.tier }}
        tier: {{ .Values.gatewayserver.labels.tier }}
        {{- end }}
    spec:
      containers:
      - name: gatewayserver
        image: {{ .Values.gatewayserver.image.repository }}:{{ .Values.gatewayserver.image.tag }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: {{ .Values.gatewayserver.containerPort }}
        env:
        - name: SPRING_PROFILES_ACTIVE
          valueFrom:
            configMapKeyRef:
              name: eazybank-config
              key: SPRING_PROFILES_ACTIVE
        - name: SPRING_CONFIG_IMPORT
          valueFrom:
            configMapKeyRef:
              name: eazybank-config
              key: SPRING_CONFIG_IMPORT
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          valueFrom:
            configMapKeyRef:
              name: eazybank-config
              key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        - name: SPRING_RABBITMQ_HOST
          valueFrom:
            configMapKeyRef:
              name: eazybank-config
              key: SPRING_RABBITMQ_HOST
        resources:
          limits:
            memory: {{ .Values.gatewayserver.resources.limits.memory }}
          requests:
            memory: {{ .Values.gatewayserver.resources.requests.memory }}
            cpu: {{ .Values.gatewayserver.resources.requests.cpu }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.gatewayserver.service.name }}
  labels:
    app: {{ .Values.gatewayserver.labels.app }}
spec:
  selector:
    app: {{ .Values.gatewayserver.labels.app }}
  type: {{ .Values.gatewayserver.service.type }}
  ports:
    - protocol: TCP
      name: http
      port: {{ .Values.gatewayserver.service.port }}
      targetPort: {{ .Values.gatewayserver.containerPort }}
---
{{- if .Values.gatewayserver.ingress.enabled }}
# Ingress - for production external access with TLS
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.gatewayserver.service.name }}
  labels:
    app: {{ .Values.gatewayserver.labels.app }}
  {{- with .Values.gatewayserver.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.gatewayserver.ingress.className }}
  ingressClassName: {{ .Values.gatewayserver.ingress.className }}
  {{- end }}
  {{- if .Values.gatewayserver.ingress.tls }}
  tls:
    {{- range .Values.gatewayserver.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.gatewayserver.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ $.Values.gatewayserver.service.name }}
                port:
                  number: {{ $.Values.gatewayserver.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
{{- end }}

