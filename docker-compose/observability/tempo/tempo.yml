# Grafana Tempo configuration
# Path: docker-compose/observability/tempo/tempo.yml
# This file configures the Tempo tracing backend (receives OTLP traces and stores them).

server:
  http_listen_port: 3200  # HTTP port for Tempo frontend (used by Grafana UI and queries)

distributor:
  receivers:
    otlp:
      protocols:
        grpc:    # Enable OTLP gRPC receiver (used by many OpenTelemetry SDKs and agents)
        http:    # Enable OTLP HTTP receiver (alternative transport for OTLP)

ingester:
  trace_idle_period: 10s      # Duration a trace can be idle before it is flushed into a block
  max_block_bytes: 1_000_000  # Maximum size in bytes for an in-memory block before flushing
  max_block_duration: 5m     # Maximum time a block can remain open before being flushed

compactor:
  compaction:
    compaction_window: 1h           # Time window used to group blocks during compaction
    max_compaction_objects: 1000000 # Maximum number of objects processed in a single compaction
    block_retention: 1h             # How long un-compacted blocks are retained before deletion
    compacted_block_retention: 10m  # How long compacted blocks are retained before deletion

storage:
  trace:
    backend: local   # Storage backend to use for traces: 'local', 's3', 'gcs', 'azure', etc.
    local:
      path: /var/tempo/blocks  # Filesystem path where Tempo writes blocks when using the 'local' backend
    pool:
      max_workers: 100   # Number of background workers for storage operations
      queue_depth: 10000 # Queue depth for storage worker tasks
