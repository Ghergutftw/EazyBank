server:
  port: 9010

spring:
  application:
    name: "message"
  cloud:
    function:
#      Available function definitions, they are combined into a single pipeline using '|'
      definition: email|sms
      # Spring Cloud Stream
    stream:
      bindings:
        emailsms-in-0:
          destination: send-communication
          group: ${spring.application.name}
        emailsms-out-0:
          destination: communication-sent
  rabbitmq:
    host: rabbit
    port: 5672
    username: guest
    password: guest
    connection-timeout: 10s